<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trường học chung</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172c45;font:16px system-ui}header{background:#15385b;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}main{max-width:1150px;margin:25px auto;padding:0 20px}section,article{background:white;border:1px solid #dde5ed;border-radius:12px;padding:20px;margin:15px 0}h1{font-size:23px;margin:0}h2{font-size:20px}h3{margin:4px 0 10px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #bdcad7;border-radius:6px;max-width:100%}input,select,textarea{width:100%;margin:5px 0 12px}textarea{min-height:100px}button{background:#1765a6;color:white;cursor:pointer;margin:4px 6px 4px 0}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap}nav button{background:white;color:#15385b}nav button.active{background:#1765a6;color:white}label{display:block;font-size:14px}small{color:#53687c}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:20px;align-items:center}.row>*{flex:1}.badge{background:#e5eef8;padding:4px 10px;border-radius:20px;font-size:13px}.error{color:#b32828}#message{position:sticky;top:0;background:#fff4d6;padding:12px;z-index:2}#message:empty{display:none}details{margin-top:15px}summary{cursor:pointer;font-weight:bold}.muted{opacity:.65}</style>
<header><h1>Trường học chung</h1><span id="identity"></span></header><main><div id="message" role="alert"></div><div id="app"></div></main>
<script>
let token=sessionStorage.getItem('school_token')||'',home,state,school='',tab='tasks';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles={admin:'Quản trị hệ thống',teacher:'Giáo viên',principal:'Hiệu trưởng',specialist:'Chuyên viên'},statuses={assigned:'Chưa nộp',submitted:'Chờ duyệt',revision:'Cần sửa',approved:'Đã duyệt'},kinds={class:'Danh sách lớp',plan:'Kế hoạch',calendar:'Lịch công tác',document:'Tài liệu chia sẻ'};
function message(s){$('message').textContent=s}
async function api(action,data={}){const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({school,...data})});const j=await r.json();if(!r.ok)throw Error(j.error||'Không kết nối được máy chủ');return j.data}
function form(id,fields,label){return `<form id="${id}">${fields}<button>${label}</button></form>`}
function input(name,label,type='text'){return `<label>${label}<input name="${name}" type="${type}" required ${type==='password'?'minlength="10" autocomplete="new-password"':''}></label>`}
function area(name,label){return `<label>${label}<textarea name="${name}" required></textarea></label>`}
function bind(id,callback){const f=$(id);if(!f)return;f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;message('');try{await callback(Object.fromEntries(new FormData(f)),f)}catch(e){message(e.message)}finally{b.disabled=false}}}
function login(){ $('identity').textContent='';$('app').innerHTML=`<section style="max-width:460px;margin:50px auto"><h2>Đăng nhập trường học</h2><p>Dùng tài khoản được hiệu trưởng hoặc quản trị cấp.</p>${form('login',input('email','Email','email')+input('password','Mật khẩu','password'),'Đăng nhập')}</section>`;bind('login',async d=>{token=(await api('login',d)).token;sessionStorage.setItem('school_token',token);await loadHome()})}
async function loadHome(){home=await api('home');$('identity').innerHTML=`${esc(home.user.name)} <button id="logout">Đăng xuất</button>`;$('logout').onclick=async()=>{try{await api('logout')}finally{token='';sessionStorage.removeItem('school_token');login()}};if(!home.schools.some(s=>s.id===school))school=home.schools[0]?.id||'';await refresh()}
async function refresh(){if(school)state=await api('state');render()}
function render(){
const manager=state&&state.role!=='teacher';
$('app').innerHTML=`<section><div class="row"><label>Trường / Năm học<select id="school">${home.schools.map(s=>`<option value="${s.id}" ${s.id===school?'selected':''}>${esc(s.name)} · ${esc(s.year)}</option>`).join('')}</select></label><div>${school?`<span class="badge">${roles[state.role]}</span>`:'Chưa được phân công trường'} <button id="refresh">Tải lại</button></div></div>${home.user.admin?`<details><summary>Tạo trường / không gian năm học</summary>${form('createSchool',input('name','Tên trường')+input('year','Năm học (ví dụ 2026–2027)'),'Tạo trường')}</details>`:''}</section>
${school?`<nav>${[['tasks','Công việc & hồ sơ'],['records','Dữ liệu chung'],['members','Thành viên'],['notifications','Thông báo ('+state.notifications.filter(n=>!n.seen).length+')'],...(manager?[['audit','Nhật ký']]:[])].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</nav><div id="content"></div>`:''}`;
$('school').onchange=async e=>{school=e.target.value;await safe(refresh)};$('refresh').onclick=()=>safe(refresh);
bind('createSchool',async d=>{school=await api('school_create',d);await loadHome()});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;safe(refresh)});if(!school)return;
const name=id=>esc(state.members.find(m=>m.id===id)?.name|| (id===home.user.id?home.user.name:'Quản trị'));
if(tab==='tasks'){
 $('content').innerHTML=`<section><h2>Tiến độ hồ sơ</h2><p>${Object.entries(statuses).map(([k,v])=>`${v}: <b>${state.tasks.filter(t=>t.status===k).length}</b>`).join(' · ')}</p><p>Quá hạn chưa duyệt: <b>${state.tasks.filter(t=>t.status!=='approved'&&t.due<new Date().toLocaleDateString('sv-SE')).length}</b></p>${manager?`<details><summary>Giao công việc</summary>${form('task',input('title','Tên công việc')+area('body','Yêu cầu')+`<label>Người nhận<select name="assignee">${state.members.map(m=>`<option value="${m.id}">${esc(m.name)} · ${roles[m.role]}</option>`).join('')}</select></label>`+input('due','Hạn nộp','date'),'Giao việc')}</details>`:''}</section>`+state.tasks.map(t=>`<article><h3>${esc(t.title)}</h3><span class="badge">${statuses[t.status]}</span><p><small>Người nhận: ${name(t.assignee)} · Hạn: ${esc(t.due)} · Người giao: ${name(t.creator)}</small></p><pre>${esc(t.body)}</pre>${t.submission?`<h4>Nội dung đã nộp</h4><pre>${esc(t.submission)}</pre>`:''}${t.feedback?`<h4>Nhận xét</h4><pre>${esc(t.feedback)}</pre>`:''}${state.files.filter(f=>f.task===t.id).map(f=>`<button data-download="${f.id}">📎 ${esc(f.name)}</button>`).join('')}
${t.assignee===home.user.id&&['assigned','revision'].includes(t.status)?`<details><summary>Nộp / nộp lại hồ sơ</summary><p>Chọn tệp và bấm đính kèm trước khi nộp.</p>${uploadForm('upload-'+t.id)}${form('submit-'+t.id,area('body','Nội dung báo cáo / ghi chú'),'Nộp hồ sơ')}</details>`:''}
${manager&&t.assignee!==home.user.id&&t.status==='submitted'?form('review-'+t.id,`<label>Kết quả<select name="status"><option value="approved">Duyệt</option><option value="revision">Yêu cầu sửa</option></select></label>`+area('feedback','Nhận xét'),'Lưu kết quả'):''}</article>`).join('');
 if(!state.tasks.length)$('content').innerHTML+='<section>Chưa có công việc.</section>';
 bind('task',async d=>{await api('task_create',d);await refresh()});
 state.tasks.forEach(t=>{bind('submit-'+t.id,async d=>{await api('submit',{...d,id:t.id,version:t.version});await refresh()});bind('review-'+t.id,async d=>{await api('review',{...d,id:t.id,version:t.version});await refresh()});bindUpload('upload-'+t.id,t.id)})
}else if(tab==='records'){
 $('content').innerHTML=`<section><h2>Dữ liệu chung · ${esc(state.school.year)}</h2><p>Thông tin tại đây được chia sẻ với các thành viên của trường.</p><details><summary>Thêm thông tin</summary>${form('record',`<label>Loại<select name="kind">${Object.entries(kinds).filter(([k])=>manager||k==='document').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`+input('title','Tiêu đề / tên lớp / sự kiện')+area('body','Nội dung (thời gian, người phụ trách, danh sách...)'),'Chia sẻ')}</details><details><summary>Tải tài liệu lên (tối đa 5 MB)</summary>${uploadForm('upload-shared')}</details></section>`+state.records.map(r=>`<article><span class="badge">${kinds[r.kind]}</span><h3>${esc(r.title)}</h3><pre>${esc(r.body)}</pre><small>${name(r.owner)}</small></article>`).join('')+`<section><h3>Tệp chia sẻ</h3>${state.files.filter(f=>!f.task).map(f=>`<button data-download="${f.id}">${esc(f.name)}</button>`).join('')||'Chưa có tệp.'}</section>`;
 bind('record',async d=>{await api('record_add',d);await refresh()});bindUpload('upload-shared',null);
}else if(tab==='members'){
 $('content').innerHTML=`<section><h2>Thành viên được cấp quyền</h2>${state.members.map(m=>`<p><b>${esc(m.name)}</b> · ${roles[m.role]} · ${esc(m.email)}</p>`).join('')||'Chưa có thành viên.'}${['admin','principal'].includes(state.role)?`<details><summary>Thêm thành viên</summary><p>Email đã có tài khoản sẽ được thêm vào trường và giữ nguyên mật khẩu. Quản trị có thể cấp cùng một tài khoản chuyên viên cho nhiều trường.</p>${form('member',input('name','Họ tên')+input('email','Email','email')+input('password','Mật khẩu ban đầu (tài khoản mới)','password')+`<label>Vai trò<select name="role">${Object.entries(roles).filter(([k])=>k!=='admin'&&(state.role==='admin'||k==='teacher')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>`,'Thêm thành viên')}</details>`:''}</section>`;bind('member',async d=>{await api('member_add',d);await refresh()});
}else if(tab==='notifications'){
 $('content').innerHTML=`<section><h2>Thông báo</h2><button id="seen">Đánh dấu đã đọc</button>${state.notifications.map(n=>`<p class="${n.seen?'muted':''}">${esc(n.text)} <small>${new Date(n.created*1000).toLocaleString('vi-VN')}</small></p>`).join('')||'<p>Chưa có thông báo.</p>'}</section>`;$('seen').onclick=()=>safe(async()=>{await api('seen');await refresh()});
}else if(tab==='audit'){
 const actions={member_add:'Thêm thành viên',record_add:'Chia sẻ nội dung',task_create:'Giao việc',submit:'Nộp hồ sơ',review:'Duyệt / yêu cầu sửa',upload:'Tải tệp lên',seen:'Đọc thông báo'};
 $('content').innerHTML=`<section><h2>100 hoạt động gần nhất</h2>${state.audit.map(a=>`<p>${new Date(a.created*1000).toLocaleString('vi-VN')} · ${esc(a.name)} · ${actions[a.action]||esc(a.action)}</p>`).join('')}</section>`;
}
document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>safe(async()=>{const f=await api('download',{id:b.dataset.download});const bytes=Uint8Array.from(atob(f.content),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}));
}
function uploadForm(id){return `<form id="${id}"><input name="file" type="file" required><button>Đính kèm tệp</button></form>`}
function bindUpload(id,task){bind(id,async(d,f)=>{const file=f.elements.file.files[0];if(file.size>5*1024*1024)throw Error('Tệp tối đa 5 MB');const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(Error('Không đọc được tệp'));reader.readAsDataURL(file)});await api('upload',{task,name:file.name,content});await refresh()})}
async function safe(fn){message('');try{await fn()}catch(e){message(e.message)}}
if(token)loadHome().catch(e=>{token='';sessionStorage.removeItem('school_token');login();message(e.message)});else login();
// Refresh only the notification count, never replace a form being edited.
setInterval(async()=>{if(!token||!school)return;try{const latest=await api('state');const b=document.querySelector('[data-tab="notifications"]');if(b)b.textContent='Thông báo ('+latest.notifications.filter(n=>!n.seen).length+')'}catch(e){}},30000);
</script></html>
