<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cùng bé nhận biết màu sắc</title>
<style>body{font-family:Segoe UI,sans-serif;background:#f3f7ed;color:#193e36;text-align:center;margin:0;padding:36px}h1{font-size:38px}p{font-size:23px}button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:18px 28px;margin:10px;background:#dfeadf;color:#173f39}.colors{display:flex;flex-wrap:wrap;justify-content:center;margin:45px 0}.colors button{width:150px;height:150px;border:8px solid white;box-shadow:0 4px 10px #0001}button:focus-visible{outline:5px solid #173f39}#feedback{min-height:40px;font-size:28px}</style>
<h1>Cùng bé tìm màu</h1><p id="question"></p><div class="colors" id="colors"></div><div id="feedback" aria-live="polite"></div><button id="next">Đổi màu cần tìm</button><p>Giáo viên đọc yêu cầu, cùng trẻ quan sát và chọn màu.</p>
<script>const colors=[['đỏ','#e45656'],['vàng','#f5cc42'],['xanh lá','#5ea96a'],['xanh dương','#528fd3']];let target=0;const q=document.querySelector('#question'),feedback=document.querySelector('#feedback');function question(){q.textContent='Bé tìm màu '+colors[target][0]+' nhé!';feedback.textContent='';}colors.forEach(([name,color],index)=>{const b=document.createElement('button');b.style.background=color;b.setAttribute('aria-label','Màu '+name);b.onclick=()=>{feedback.textContent=index===target?'Đúng rồi! Cùng tìm đồ vật có màu này nhé.':'Mình cùng quan sát và thử lại nhé.';};document.querySelector('#colors').append(b);});document.querySelector('#next').onclick=()=>{target=(target+1+Math.floor(Math.random()*3))%4;question();};question();</script></html>
