<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đồng hồ hoạt động</title>
<style>body{font-family:Segoe UI,sans-serif;text-align:center;background:#f3f7ed;color:#173f39;padding:40px}h1{font-size:36px}#clock{font-size:150px;font-variant-numeric:tabular-nums;margin:40px}button{font:20px Segoe UI;border:0;border-radius:16px;padding:18px 28px;margin:8px;cursor:pointer;background:#dfeadf;color:#173f39}#status{font-size:24px;min-height:35px}button:focus-visible{outline:4px solid #207465}</style>
<h1>Đồng hồ hoạt động của lớp</h1><div id="clock" role="timer">03:00</div><p id="status" aria-live="polite">Sẵn sàng cùng trẻ</p><div id="presets"></div><button id="start">Bắt đầu</button><button id="reset">Đặt lại</button>
<script>let duration=180,remaining=duration,end=0,running=false;const clock=document.querySelector('#clock'),status=document.querySelector('#status'),start=document.querySelector('#start');function render(){clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');start.textContent=running?'Tạm dừng':'Bắt đầu';}function set(n){duration=n*60;remaining=duration;running=false;status.textContent='Sẵn sàng cùng trẻ';render();}[1,3,5,10].forEach(n=>{const b=document.createElement('button');b.textContent=n+' phút';b.onclick=()=>set(n);document.querySelector('#presets').append(b);});start.onclick=()=>{if(remaining===0)remaining=duration;running=!running;if(running)end=Date.now()+remaining*1000;status.textContent=running?'Đang hoạt động':'Đã tạm dừng';render();};document.querySelector('#reset').onclick=()=>set(duration/60);setInterval(()=>{if(!running)return;remaining=Math.max(0,Math.ceil((end-Date.now())/1000));if(!remaining){running=false;status.textContent='Hết thời gian. Cùng chuyển hoạt động nhé!';}render();},200);render();</script></html>
