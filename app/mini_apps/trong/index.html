<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phần mềm dạy học</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="thanh-dau">
  <h1 id="tieuDe">Phần mềm dạy học</h1>
  <span class="phu" id="monLop"></span>
  <button class="nut nut-nho" id="nutToanManHinh" type="button" title="Toàn màn hình (phím F)">Toàn màn hình</button>
</header>

<main class="noi-dung" id="noiDung">
  <!-- Vùng nội dung: trợ lý viết phần giao diện của phần mềm vào đây -->
  <h2 class="loi-gioi-thieu" id="loiGioiThieu"></h2>
  <div class="luoi-the" id="cacMuc"></div>
  <div class="hang-nut">
    <button class="nut nut-chinh nut-lon" id="nutThu" type="button">Bấm thử</button>
  </div>
  <p class="thong-bao" id="thongBao" aria-live="polite"></p>
</main>

<footer class="goi-y-phim">
  <kbd>Space</kbd> bấm thử · <kbd>F</kbd> toàn màn hình
</footer>

<script src="du-lieu.js"></script>
<script src="app.js"></script>
</body>
</html>
